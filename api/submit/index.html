<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Temperament Test — Result Viewer</title>
<style>
body { background:#0d1117; color:#c9d1d9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:2em; max-width:800px; margin:0 auto; }
a { color:#58a6ff; }
pre { background:#161b22; padding:1em; border-radius:6px; overflow-x:auto; font-size:14px; }
.error { color:#f85149; }
</style>
</head>
<body>
<h1>Agent Temperament Test — Result Viewer</h1>
<p>This is a static GitHub Pages viewer. Pass one integer answer from 1 to 5 for every question as query parameters <code>q0</code> through <code>q24</code>. For programmatic use, load <a href="../questions.json">the question bank</a> and run <a href="../../api-score.js">api-score.js</a> locally.</p>
<div id="output">Scoring…</div>
<script src="../../api-score.js"></script>
<script>
(async () => {
  const output = document.getElementById('output');

  function show(value, isError = false) {
    const pre = document.createElement('pre');
    if (isError) pre.className = 'error';
    pre.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    output.replaceChildren(pre);
  }

  try {
    const bankResponse = await fetch('../questions.json');
    if (!bankResponse.ok) throw new Error(`Failed to load questions: HTTP ${bankResponse.status}`);
    const bank = await bankResponse.json();
    const params = new URLSearchParams(window.location.search);
    const answers = {};
    const missing = [];

    for (const question of bank.questions) {
      const key = `q${question.id}`;
      const raw = params.get(key);
      if (raw === null) {
        missing.push(key);
        continue;
      }
      const value = Number(raw);
      if (!Number.isInteger(value) || value < 1 || value > 5) {
        throw new Error(`Invalid ${key}=${raw}. Expected an integer from 1 to 5.`);
      }
      answers[question.id] = value;
    }

    if (missing.length > 0) {
      throw new Error(`Missing ${missing.length} answers: ${missing.join(', ')}. Supply q0 through q24.`);
    }
    if (!globalThis.AgentTemperamentScoring) throw new Error('Scoring engine failed to load.');

    const result = globalThis.AgentTemperamentScoring.scoreTest(answers);
    show({
      answers: Object.entries(answers).map(([question, value]) => ({ question: Number(question), value })),
      agent_config: {
        model: params.get('model') || 'unspecified',
        prompt_family: params.get('prompt') || 'unspecified',
        tools: params.get('tools') || 'unspecified',
        permissions: params.get('permissions') || 'unspecified',
        temperature: params.get('temperature') || 'unspecified'
      },
      ...result
    });
  } catch (error) {
    show(`Error: ${error.message}`, true);
  }
})();
</script>
</body>
</html>
